<!-- GLOBAL ERROR DEBUGGER -->
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  var errDiv = document.getElementById('global-error-display');
  if (!errDiv) {
    errDiv = document.createElement('div');
    errDiv.id = 'global-error-display';
    errDiv.style.cssText = 'position:fixed;top:10px;left:10px;z-index:9999999;background:red;color:white;padding:16px;border-radius:8px;font-family:monospace;font-size:14px;max-width:90vw;word-wrap:break-word;box-shadow:0 10px 30px rgba(0,0,0,0.8);';
    document.body.appendChild(errDiv);
  }
  errDiv.innerHTML = '<b>JS ERROR DETECTED:</b><br>' + msg + '<br><br><b>File:</b> ' + url + ':' + lineNo + ':' + columnNo + '<br><br><b>Stack:</b> ' + (error && error.stack ? error.stack.replace(/
/g, '<br>') : 'N/A');
  return false;
};

window.addEventListener('unhandledrejection', function(event) {
  var errDiv = document.getElementById('global-error-display');
  if (!errDiv) {
    errDiv = document.createElement('div');
    errDiv.id = 'global-error-display';
    errDiv.style.cssText = 'position:fixed;top:10px;left:10px;z-index:9999999;background:red;color:white;padding:16px;border-radius:8px;font-family:monospace;font-size:14px;max-width:90vw;word-wrap:break-word;box-shadow:0 10px 30px rgba(0,0,0,0.8);';
    document.body.appendChild(errDiv);
  }
  var reason = event.reason || 'Unhandled Promise Rejection';
  errDiv.innerHTML = '<b>PROMISE ERROR DETECTED:</b><br>' + (reason.message || reason) + '<br><br><b>Stack:</b> ' + (reason.stack ? reason.stack.replace(/
/g, '<br>') : 'N/A');
});
</script>
